[SERVICE]
    Flush            5
    Daemon           off
    Log_Level        info
    Parsers_File     /fluent-bit/etc/parsers.conf

[INPUT]
    Name             tail
    Path             /var/lib/docker/containers/*/*.log
    Path_Key         file
    Multiline.Parser docker
    Tag              docker.*
    DB               /buffer/tail.db
    Mem_Buf_Limit    16MB
    Skip_Long_Lines  On
    Refresh_Interval 5

[FILTER]
    Name    lua
    Match   docker.*
    Script  /cfg/service-label.lua
    Call    set_service

[FILTER]
    Name    grep
    Match   docker.*
    Regex   service ^rebate-(bot|executor|accrual)$

[FILTER]
    Name    lua
    Match   docker.*
    Script  /cfg/redact.lua
    Call    redact

[OUTPUT]
    Name            loki
    Match           docker.*
    Host            ${GRAFANA_LOKI_HOST}
    Port            443
    Tls             On
    Tls.verify      On
    Http_User       ${GRAFANA_LOKI_USER}
    Http_Passwd     ${GRAFANA_LOKI_TOKEN}
    Labels          job=rebate-bot, $service, $level
    Remove_keys     file,stream,time,service,level
    Line_format     json
    Drop_single_key On
